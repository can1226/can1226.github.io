<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>啰啰咚 · 数字微体验</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app" id="app">

  <!-- ===== 第1页：封面 ===== -->
  <section class="page" data-page="0">
    <div class="cover-content">
      <p class="cover-eyebrow">国家级非物质文化遗产 · 监利秧田号子</p>
      <h1 class="cover-title">啰啰咚</h1>
      <p class="cover-sub">听一段水田里的号子，<br>集一枚农耕的印章。</p>
      <button class="btn-primary" id="enterBtn">开始体验</button>
      <p class="cover-hint">上下滑动翻页</p>
    </div>
  </section>

  <!-- ===== 第2页：试听 ===== -->
  <section class="page" data-page="1">
    <div class="section-head">
      <span class="section-index">01</span>
      <h2>听一段</h2>
    </div>

    <div class="player-card">
      <div class="player-disc" id="disc">啰</div>
      <div class="subtitle-box" id="subtitle">点击播放，感受秧田里的节奏。</div>
      <div class="player-controls">
        <button class="btn-round" id="playBtn">▶</button>
        <button class="btn-round btn-ghost" id="stopBtn" disabled>■</button>
      </div>
    </div>

    <p class="footnote">音频片段需经传承人授权；完整唱段不在此展示。</p>
  </section>

  <!-- ===== 第3页：方言听译 ===== -->
  <section class="page" data-page="2">
    <div class="section-head">
      <span class="section-index">02</span>
      <h2>听懂一句</h2>
    </div>
    <p class="section-lead">点击唱词卡片，看它的普通话释义。</p>
    <div class="translate-list" id="translateList"></div>
  </section>

  <!-- ===== 第4页：打卡集章 ===== -->
  <section class="page" data-page="3">
    <div class="section-head">
      <span class="section-index">03</span>
      <h2>集一枚章</h2>
    </div>
    <p class="section-lead">完成一次体验，盖一枚农耕印记。</p>

    <div class="stamp-grid" id="stampGrid"></div>

    <button class="btn-primary" id="stampBtn">盖下这一枚</button>
    <p class="stamp-count" id="stampCount">已集 0 / 4</p>
  </section>

  <!-- ===== 第5页：海报 ===== -->
  <section class="page" data-page="4">
    <div class="section-head">
      <span class="section-index">04</span>
      <h2>带走一张</h2>
    </div>
    <p class="section-lead">生成你的非遗打卡海报，长按保存。</p>

    <button class="btn-primary" id="posterBtn">生成分享海报</button>
    <canvas id="posterCanvas" width="750" height="1000"></canvas>
    <p class="footnote" id="posterHint">海报在微信内长按图片即可保存。</p>
  </section>

</div>

<script src="js/app.js"></script>
</body>
</html>
